# ros_gz_bridge topic mappings.
# Note: /cmd_vel, /odom, /tf, and /joint_states are ROS-native (produced by
# ros2_control), so they need NO bridge. Only Gazebo-side sensors are bridged.

# Simulation clock so every ROS node can run on sim time.
- gz_topic_name: "/clock"
  ros_topic_name: "/clock"
  gz_type_name: "gz.msgs.Clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  direction: GZ_TO_ROS

# 2D lidar on the base.
- gz_topic_name: "scan"
  ros_topic_name: "/scan"
  gz_type_name: "gz.msgs.LaserScan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  direction: GZ_TO_ROS

# Wrist RGB-D camera (used for the GUI / rviz; the v1 mission uses known
# poses and does not depend on these).
- gz_topic_name: "wrist_camera/image"
  ros_topic_name: "/wrist_camera/image"
  gz_type_name: "gz.msgs.Image"
  ros_type_name: "sensor_msgs/msg/Image"
  direction: GZ_TO_ROS

- gz_topic_name: "wrist_camera/points"
  ros_topic_name: "/wrist_camera/points"
  gz_type_name: "gz.msgs.PointCloudPacked"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  direction: GZ_TO_ROS
