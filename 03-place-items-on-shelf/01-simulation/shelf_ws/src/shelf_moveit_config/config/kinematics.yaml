# KDL IK for the arm group. position_only_ik helps a 5-DoF arm reach 3D
# positions; the mission seeds goals as joint values via ikpy, so this is a
# fallback solver only.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
