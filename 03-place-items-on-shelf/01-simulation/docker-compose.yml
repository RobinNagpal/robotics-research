services:
  sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: shelf-sim:latest
    container_name: shelf-sim
    # Keep ROS 2 / Gazebo discovery on loopback inside the container so the
    # demo needs no host networking or multicast (portable to macOS/Windows).
    environment:
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - RCUTILS_COLORIZED_OUTPUT=1
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1
      # Gazebo finds our worlds/models via paths set in the entrypoint.
    volumes:
      # X11 socket for the optional GUI mode on Linux (ignored if absent).
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Per-run success/failure logs are written here and appear on the host.
      - ./logs:/ws/logs
    working_dir: /ws
